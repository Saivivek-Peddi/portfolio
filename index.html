<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Notes by Sai Vivek Peddi" href="/rss.xml" />
    <!--app-head-->
    <script>
      // Resolve the theme before first paint so there is no flash.
      ;(function () {
        var root = document.documentElement
        root.classList.remove('no-js')
        var pref = 'auto'
        try {
          pref = localStorage.getItem('theme') || 'auto'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        root.dataset.themePref = pref
      })()
    </script>
  </head>
  <body>
    <div id="root" data-path="<!--app-path-->"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
